name: BIO CE checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # The release build and local qualification use the official CPython 3.12.10.
          python-version: "3.12.10"
      - name: Install pinned dependencies and BIO CE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-mcp.lock.txt -r requirements-test.lock.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Run the test suite
        shell: pwsh
        run: |
          $logDir = Join-Path $env:RUNNER_TEMP "bio-ce-pytest-logs"
          $testTemp = Join-Path $env:RUNNER_TEMP "bio-ce-test-temp"
          New-Item -ItemType Directory -Path $logDir, $testTemp -Force | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          $logFile = Join-Path $logDir "pytest.log"
          $junitFile = Join-Path $logDir "pytest-results.xml"
          python -m pytest -q -rs --junitxml $junitFile *> $logFile
          $testExitCode = $LASTEXITCODE
          Get-Content $logFile
          exit $testExitCode
      - name: Preserve pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-pytest-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/bio-ce-pytest-logs/
          if-no-files-found: warn
          retention-days: 14
